<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>햄찌스 데스크</title>
<meta name="theme-color" content="#1c1c1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="데스크">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* macOS 다크 — 반투명 사이드바 + 단색 창, 시스템 색, 카드는 '그룹' 단위로만 */
:root{
  color-scheme:dark;
  --wall:#0a0a0f;
  --win:rgba(30,30,32,.92);
  --side:rgba(52,52,56,.42);
  --card:rgba(255,255,255,.045);
  --card-2:rgba(255,255,255,.085);
  --fill:rgba(118,118,128,.24);
  --fill-2:rgba(118,118,128,.36);
  --line:rgba(255,255,255,.085);
  --fg:#f5f5f7;
  --fg2:rgba(235,235,245,.62);
  --fg3:rgba(235,235,245,.34);
  --blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--purple:#bf5af2;--pink:#ff375f;
  --yellow:#ffd60a;--teal:#64d2ff;--indigo:#5e5ce6;--mint:#66d4cf;--brown:#ac8e68;--gray:#98989d;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;
  --num:"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Noto Sans KR","Segoe UI",sans-serif;
  --r:12px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--wall);color:var(--fg);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.005em;overflow:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(60% 50% at 12% 10%,rgba(94,92,230,.32),transparent 70%),
             radial-gradient(50% 45% at 90% 85%,rgba(255,55,95,.16),transparent 70%),
             radial-gradient(40% 40% at 70% 15%,rgba(100,210,255,.12),transparent 70%),var(--wall)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid rgba(10,132,255,.55);outline-offset:1px;border-radius:6px}
[hidden]{display:none!important}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ── 창 ── */
.app{position:fixed;inset:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));
  display:grid;grid-template-columns:232px minmax(0,1fr);border-radius:14px;overflow:hidden;
  border:.5px solid rgba(255,255,255,.14);box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 .5px rgba(0,0,0,.6);max-width:1760px;margin:0 auto}
.side{background:var(--side);backdrop-filter:blur(40px) saturate(1.6);-webkit-backdrop-filter:blur(40px) saturate(1.6);
  border-right:.5px solid rgba(0,0,0,.5);display:flex;flex-direction:column;min-height:0}
.lights{display:flex;gap:8px;padding:16px 16px 8px}
.nav{padding:6px 10px;display:grid;gap:1px;overflow:auto;flex:1;min-height:0;align-content:start}
.nav h6{margin:14px 8px 4px;font-size:11px;font-weight:600;color:var(--fg3);letter-spacing:.02em}
.nav button{display:flex;align-items:center;gap:9px;border:0;background:transparent;padding:6px 8px;border-radius:7px;text-align:left;font-size:13.5px;color:var(--fg)}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button[aria-current="page"]{background:rgba(255,255,255,.12)}
.nav button .i{color:var(--blue)}
.nav button .c{margin-left:auto;font-size:12px;color:var(--fg3)}
.nav .dot{width:8px;height:8px;border-radius:50%;flex:none;margin:0 4px}
.side-foot{padding:8px 10px 12px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;border-top:.5px solid var(--line)}
.sync{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--fg3);padding:0 6px}
.sync button{border:0;background:transparent;color:var(--fg2);padding:4px;border-radius:6px;display:grid}
.sync button:hover{background:rgba(255,255,255,.08)}
.sync .led{width:7px;height:7px;border-radius:50%;background:var(--green)}
.sync .led.busy{background:var(--orange);animation:pulse 1s infinite}
.sync .led.bad{background:var(--red)}
@keyframes pulse{50%{opacity:.35}}

.main{background:var(--win);min-width:0;min-height:0;display:flex;flex-direction:column}
.toolbar{display:flex;align-items:center;gap:10px;padding:12px 22px;border-bottom:.5px solid var(--line);min-height:56px}
.toolbar h1{font-size:15px;font-weight:700;margin:0}
.toolbar .sub{color:var(--fg3);font-size:12.5px}
.toolbar .sp{flex:1}
.search{display:flex;align-items:center;gap:6px;background:var(--fill);border:0;border-radius:7px;padding:5px 10px;color:var(--fg3);font-size:13px;min-width:190px}
.search kbd{margin-left:auto;font:11px var(--font);color:var(--fg3)}
.scroll{overflow:auto;flex:1;min-height:0;padding:20px 22px 40px;scroll-behavior:smooth}
.page{display:grid;gap:18px;max-width:1500px;margin:0 auto}

/* ── 공통 요소 ── */
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:7px;padding:5px 11px;background:var(--fill);font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--fill-2)}
.btn.pri{background:var(--blue);color:#fff}
.btn.go{background:#30d158;color:#04210d;font-weight:600}
.btn.go:hover{background:#3ee068}
.btn.go.arm{background:#1f9e44;color:#fff;box-shadow:0 0 0 3px rgba(48,209,88,.3)}
.btn.pri:hover{background:#2b95ff}
.btn.ghost{background:transparent;color:var(--blue);padding:4px 6px}
.btn.ghost:hover{background:rgba(10,132,255,.12)}
.btn.bad{color:var(--red)}
.btn.sm{padding:3px 8px;font-size:12px}
.icon-btn{border:0;background:transparent;color:var(--fg2);width:28px;height:28px;border-radius:7px;display:grid;place-items:center}
.icon-btn:hover{background:rgba(255,255,255,.08);color:var(--fg)}
.seg{display:inline-flex;background:var(--fill);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:6px;padding:3px 11px;font-size:12.5px;font-weight:500;color:var(--fg)}
.seg button[aria-pressed="true"]{background:#636366;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.in{background:rgba(0,0,0,.25);border:.5px solid var(--line);border-radius:7px;padding:6px 10px;font-size:13px;min-width:0}
.in:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px rgba(10,132,255,.35)}
select.in{padding-right:24px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--fg2)} .faint{color:var(--fg3)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--fg2);white-space:nowrap}
.tag i{width:7px;height:7px;border-radius:50%}
/* 남은 일: 프로젝트 점이 네온처럼 깜박 */
.task:not(.done) .meta .tag i{opacity:1;filter:none;animation:neon 2.4s ease-in-out infinite}
@keyframes neon{0%,100%{box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 70%,transparent),0 0 6px 2px var(--c),0 0 14px 4px color-mix(in srgb,var(--c) 45%,transparent)}50%{box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 70%,transparent),0 0 2px 0 color-mix(in srgb,var(--c) 40%,transparent),0 0 0 0 transparent}}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px;background:var(--fill);color:var(--fg2);white-space:nowrap}
.pill.red{background:rgba(255,69,58,.18);color:#ff6961}
.pill.orange{background:rgba(255,159,10,.18);color:var(--orange)}
.pill.blue{background:rgba(10,132,255,.2);color:#409cff}
.pill.green{background:rgba(48,209,88,.18);color:var(--green)}
.card>.btn,.card>a.btn{justify-self:start}
.empty{color:var(--fg3);font-size:13px;padding:10px 4px}

/* 그룹 카드 */
.card{background:var(--card);border:.5px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;align-content:start;min-width:0}
.card>header{display:flex;align-items:center;gap:8px;min-height:24px}
.card>header h2{margin:0;font-size:14.5px;font-weight:650}
.card>header .count{font-size:12px;color:var(--fg3)}
.card>header .sp{flex:1}
.card.attn{background:linear-gradient(180deg,rgba(255,159,10,.10),rgba(255,159,10,.03));border-color:rgba(255,159,10,.28)}
.grid{display:grid;gap:18px}
.g-today{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.stack{display:grid;gap:18px;align-content:start}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}

/* 큰 제목 */
.hero{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hero h2{margin:0;font-size:30px;font-weight:700;letter-spacing:-.02em}
.hero .clock{font-family:var(--num);font-size:30px;font-weight:300;color:var(--fg2);font-variant-numeric:tabular-nums}
.hero .sum{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.stat{display:grid;padding:8px 14px;border-radius:10px;background:var(--card);border:.5px solid var(--line);min-width:88px;text-align:left;cursor:pointer}
.stat:hover{background:var(--card-2)}
.stat b{font:600 22px/1.15 var(--num);font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--fg2)}
.stat.red b{color:var(--red)} .stat.orange b{color:var(--orange)} .stat.blue b{color:#409cff} .stat.green b{color:var(--green)}

/* 빠른 입력 */
.quick{display:grid;gap:6px;background:var(--card);border:.5px solid var(--line);border-radius:var(--r);padding:8px 10px 8px 8px}
.quick .bar{display:flex;gap:8px;align-items:center}
.quick input{flex:1;min-width:0;border:0;background:transparent;font-size:15px;padding:6px 4px}
.quick input:focus{outline:0}
.quick .plus{width:26px;height:26px;border-radius:50%;background:var(--blue);display:grid;place-items:center;color:#fff;flex:none}
.quick .hint{font-size:12px;color:var(--fg3);padding:0 4px 2px 42px;display:flex;gap:10px;flex-wrap:wrap;min-height:18px}
.quick .hint b{color:var(--fg2);font-weight:500}

/* D-day 줄 */
.ddays{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.dday{flex:none;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;background:var(--card);border:.5px solid var(--line);max-width:300px;cursor:pointer;text-align:left}
.dday:hover{background:var(--card-2)}
.dday b{font:700 15px var(--num);min-width:38px}
.dday span{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dday.d0 b{color:var(--red)} .dday.d3 b{color:var(--orange)} .dday.dn b{color:#409cff}

/* 할 일 줄 (미리 알림 스타일) */
.list{display:grid}
.sec-t{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--fg2);padding:8px 2px 4px}
.sec-t.red{color:#ff6961}
.sec-t .sp{flex:1}
.task{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:7px 4px;border-bottom:.5px solid var(--line);border-radius:6px}
.task:last-child{border-bottom:0}
.task:hover{background:rgba(255,255,255,.035)}
.task.sel{background:rgba(10,132,255,.16)}
.task[draggable="true"]{cursor:grab}
.task.dragging{opacity:.4}
.ck{width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(235,235,245,.32);background:transparent;display:grid;place-items:center;padding:0;margin-top:1px}
.ck:hover{border-color:var(--blue)}
.ck svg{width:12px;height:12px;stroke:#fff;stroke-width:2.6;fill:none;opacity:0}
.ck.on{background:var(--blue);border-color:var(--blue)}
.ck.on svg{opacity:1}
.ck.pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.25)}}
.task .body{min-width:0;display:grid;gap:2px;cursor:pointer}
.task .tt{font-size:13.5px;overflow-wrap:anywhere}
.task.done .tt{color:var(--fg3);text-decoration:line-through}
.task .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--fg3)}
.task .meta .late{color:#ff6961}
.task .meta .today{color:#409cff}
.task .side-a{display:flex;gap:4px;align-items:center}
.prio{font:800 12px var(--num);color:var(--orange);letter-spacing:-.05em}
.prio.p3{color:var(--red)}
.task .act{opacity:0;transition:opacity .15s}
.task:hover .act,.task:focus-within .act{opacity:1}

/* 일정 */
.ev{display:grid;grid-template-columns:46px 3px minmax(0,1fr);gap:9px;align-items:center;padding:5px 2px;font-size:13px}
.ev .tm{font:500 12px var(--num);color:var(--fg2);text-align:right;font-variant-numeric:tabular-nums}
.ev .bar{align-self:stretch;border-radius:2px;background:var(--blue)}
.ev .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .loc{font-size:11.5px;color:var(--fg3)}
.ev.now .tm{color:var(--red)}

/* 이번 주 */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:rgba(0,0,0,.18);border:.5px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:4px;align-content:start;min-height:170px;min-width:0}
.day.today{border-color:rgba(10,132,255,.6);box-shadow:inset 0 0 0 .5px rgba(10,132,255,.6)}
.day.over{background:rgba(10,132,255,.14)}
.day>header{display:flex;align-items:baseline;gap:6px;padding:0 2px 4px}
.day>header b{font:700 18px var(--num)}
.day>header span{font-size:11.5px;color:var(--fg2)}
.day.today>header b{color:#fff;background:var(--red);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:14px}
.day.sun>header span,.day.sun>header b{color:#ff6961}
.day>header .icon-btn{margin-left:auto;width:22px;height:22px}
.wk-ev{font-size:11.5px;padding:3px 6px;border-radius:5px;background:rgba(10,132,255,.2);color:#cfe5ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-ev b{font-weight:600;font-family:var(--num);margin-right:4px}
.wk-t{display:grid;grid-template-columns:14px minmax(0,1fr);gap:6px;align-items:start;font-size:12px;padding:3px 4px;border-radius:5px;cursor:grab}
.wk-t:hover{background:rgba(255,255,255,.06)}
.wk-t .ck{width:14px;height:14px;border-width:1.2px;margin-top:2px}
.wk-t .ck svg{width:9px;height:9px}
.wk-t span{overflow-wrap:anywhere;cursor:pointer}
.wk-t.done span{color:var(--fg3);text-decoration:line-through}
.wk-t.hi span{color:#ffb340}
.day .add-in{width:100%;font-size:12px;padding:4px 6px}

/* 습관 */
.habits{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.hb{border:.5px solid var(--line);background:rgba(0,0,0,.18);border-radius:11px;padding:10px;display:grid;gap:6px;text-align:left}
.hb:hover{background:rgba(255,255,255,.06)}
.hb .ic{font-size:20px;line-height:1}
.hb b{font-size:13px;font-weight:600}
.hb span{font-size:11.5px;color:var(--fg2)}
.hb.on{background:rgba(48,209,88,.16);border-color:rgba(48,209,88,.45)}
.hb.on span{color:var(--green)}
.hgrid{display:grid;grid-template-columns:minmax(110px,1.4fr) repeat(7,minmax(26px,1fr)) 70px;gap:4px;align-items:center;font-size:12.5px}
.hgrid .hd{font-size:11px;color:var(--fg3);text-align:center}
.hgrid .hd.t{color:#409cff;font-weight:700}
.hcell{width:100%;aspect-ratio:1;max-width:30px;justify-self:center;border-radius:8px;border:0;background:var(--fill);padding:0}
.hcell.on{background:var(--green)}
.hgrid .nm{display:flex;gap:6px;align-items:center;min-width:0}
.hgrid .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hgrid .st{font-size:11.5px;color:var(--fg2);text-align:right}

/* 메모 */
.memo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start;padding:8px 2px;border-bottom:.5px solid var(--line)}
.memo:last-child{border-bottom:0}
.memo p{margin:0;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.memo .meta{font-size:11px;color:var(--fg3);margin-top:3px;display:flex;gap:8px}
.memo .acts{display:flex;gap:2px;opacity:.55}
.memo:hover .acts{opacity:1}
.memo.pin p::before{content:"📌 "}

/* 칸반 */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:10px;overflow-x:auto;padding-bottom:4px}
.col{background:rgba(0,0,0,.18);border:.5px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:6px;align-content:start;min-height:120px}
.col.over{background:rgba(10,132,255,.14)}
.col>header{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:600;color:var(--fg2);padding:2px 4px}
.kc{background:var(--card-2);border:.5px solid var(--line);border-radius:9px;padding:8px 10px;display:grid;gap:3px;cursor:grab;text-align:left}
.kc:hover{background:rgba(255,255,255,.12)}
.kc b{font-size:13px;font-weight:600;overflow-wrap:anywhere}
.kc span{font-size:11.5px;color:var(--fg2)}

/* 표 */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11.5px;font-weight:600;color:var(--fg3);text-align:right;padding:6px 10px;border-bottom:.5px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:.5px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tr.cur td{background:rgba(10,132,255,.1)}

/* 큰 숫자 */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--card);border:.5px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px}
.kpi span{font-size:12px;color:var(--fg2)}
.kpi b{font:600 28px/1.15 var(--num);font-variant-numeric:tabular-nums}
.kpi small{font-size:11.5px;color:var(--fg3)}

/* 프로젝트 */
.projs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.proj{background:var(--card);border:.5px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;text-align:left}
.proj:hover{background:var(--card-2)}
.proj b{font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj span{font-size:11.5px;color:var(--fg2)}
.bars{display:grid;gap:7px}
.hbar{display:grid;grid-template-columns:110px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:12.5px}
.hbar .tr{height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:4px}
.hbar b{font:600 12.5px var(--num);text-align:right}

/* 포트폴리오 · 모션그래픽 */
.pfw{display:grid;gap:18px}
.pf-hero{position:relative;overflow:hidden;border-radius:18px;padding:26px 28px 22px;border:.5px solid rgba(255,255,255,.12);background:#0d0d12;isolation:isolate}
.au{position:absolute;inset:-35%;z-index:-2;filter:blur(64px);opacity:.7;pointer-events:none}
.au i{position:absolute;width:42%;height:42%;border-radius:50%;mix-blend-mode:screen;animation:drift 20s ease-in-out infinite alternate}
.au i:nth-child(1){background:#0a84ff;left:18%;top:22%}
.au i:nth-child(2){background:#5e5ce6;left:48%;top:30%;animation-duration:24s;animation-delay:-7s}
.au i:nth-child(3){background:#199e70;left:32%;top:52%;animation-duration:28s;animation-delay:-13s;opacity:.8}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(20%,-14%) scale(1.25)}100%{transform:translate(-16%,12%) scale(.9)}}
.grain{position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.07) 1px,transparent 0) 0 0/4px 4px;-webkit-mask:linear-gradient(#000,transparent 85%);mask:linear-gradient(#000,transparent 85%)}
.pf-scan{position:absolute;left:0;right:0;bottom:0;height:1px;background:linear-gradient(90deg,transparent,#64d2ff 50%,transparent);animation:scan 5s ease-in-out infinite;opacity:.8}
@keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.pf-eye{margin:0;font:600 11px var(--num);letter-spacing:.2em;color:rgba(235,235,245,.55)}
.pf-title{margin:6px 0 4px;font-size:34px;font-weight:760;letter-spacing:-.025em;line-height:1.15;background:linear-gradient(100deg,#fff 0%,#a9d3ff 35%,#c9bcff 55%,#fff 75%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 9s linear infinite}
.pf-title.xl{font-size:clamp(38px,6vw,76px)}
@keyframes sheen{to{background-position:-260% 0}}
.pf-sub{margin:0;color:var(--fg2);font-size:13.5px}.pf-sub.lg{font-size:clamp(14px,1.6vw,19px)}
.pf-big{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}
.pf-big>div{background:rgba(255,255,255,.05);border:.5px solid rgba(255,255,255,.1);border-radius:14px;padding:14px 16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pf-big b{display:flex;align-items:baseline;gap:4px;font:700 38px/1.05 var(--num);letter-spacing:-.03em;font-variant-numeric:tabular-nums;text-shadow:0 0 28px rgba(100,170,255,.35)}
.pf-big b em{font:500 14px var(--font);font-style:normal;color:var(--fg2);text-shadow:none}
.pf-big small{color:var(--fg2);font-size:12px}
.pf-acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:11.5px;color:var(--fg2)}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.donut-wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.donut svg{width:100%;height:100%;overflow:visible}
.donut .dn{font:700 30px var(--num);fill:#f5f5f7}.donut .dl{font-size:11px;fill:rgba(235,235,245,.6)}
.donut-seg{transition:stroke-width .15s;cursor:default}.donut-seg:hover{stroke-width:28}
.dlist{display:grid;gap:7px;font-size:12.5px}
.dlist>div{display:grid;grid-template-columns:10px minmax(0,1fr) auto 38px;gap:8px;align-items:center}
.dlist i{width:9px;height:9px;border-radius:2px}.dlist b{font:600 12.5px var(--num)}.dlist em{font:500 11.5px var(--num);font-style:normal;color:var(--fg3);text-align:right}
.radar{margin:0 auto;width:100%}.radar svg{width:100%;height:auto;overflow:visible}
.radar text{font-size:10px;fill:rgba(235,235,245,.62)}
.mbars{display:flex;align-items:stretch;gap:10px}
.mbar{flex:1;display:grid;grid-template-rows:18px minmax(0,1fr) auto;min-width:0;text-align:center}
.mbar .tot{font:600 11.5px var(--num);color:var(--fg2)}
.mbar .mcol{display:flex;align-items:flex-end;justify-content:center;border-bottom:.5px solid rgba(255,255,255,.12)}
.mbar .stk{width:100%;max-width:40px;display:flex;flex-direction:column-reverse;gap:2px;transform-origin:bottom}
.mbar .stk i{display:block;width:100%;min-height:2px}.mbar .stk i:last-child{border-radius:4px 4px 0 0}
.mbar .stk:hover i{filter:brightness(1.15)}
.mbar .lb{font-size:11px;color:var(--fg3);margin-top:6px}
.heat-wrap{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.heat-days{display:grid;grid-template-rows:repeat(7,1fr);gap:3px;font-size:9.5px;color:var(--fg3);align-items:center}
.heat{flex:1;display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,auto);grid-auto-columns:minmax(10px,17px);gap:3px}
.heat i{border-radius:3px;aspect-ratio:1}.heat i:hover{outline:1px solid rgba(255,255,255,.6)}
.gantt{display:grid;gap:8px}
.grow{display:grid;grid-template-columns:150px minmax(0,1fr) 56px;gap:12px;align-items:center;font-size:12.5px}
.ghead{height:16px}.gmonths{position:relative;height:16px;font-size:10.5px;color:var(--fg3)}
.gmonths span{position:absolute;top:0;padding-left:4px;border-left:.5px solid rgba(255,255,255,.12);height:100%}
.gname{display:flex;align-items:center;gap:7px;min-width:0}.gname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gname i{width:8px;height:8px;border-radius:50%;flex:none}
.gtrack{position:relative;height:20px;border-radius:10px;background:rgba(255,255,255,.035)}
.gbar{position:absolute;top:3px;bottom:3px;border-radius:7px;transform-origin:left;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 45%,transparent),var(--c));box-shadow:0 0 14px color-mix(in srgb,var(--c) 40%,transparent);display:flex;align-items:center;justify-content:flex-end;padding-right:6px;min-width:22px}
.gbar b{font:700 10.5px var(--num);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.gst{font-size:10.5px;padding:2px 7px;border-radius:10px;text-align:center}
.gst.live{color:#7ee2a0;background:rgba(48,209,88,.13)}.gst.done{color:var(--fg3);background:var(--fill)}
.live-dot{animation:neon 2.4s ease-in-out infinite}
.cv{display:grid;gap:8px;max-height:380px;overflow:auto}
.cv>div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;background:rgba(0,0,0,.18);border:.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.6}
#tip{white-space:pre;line-height:1.5;position:fixed;z-index:90;pointer-events:none;background:rgba(28,28,30,.96);border:.5px solid rgba(255,255,255,.18);border-radius:8px;padding:6px 9px;font-size:12px;color:var(--fg);box-shadow:0 8px 24px rgba(0,0,0,.5);white-space:nowrap}
/* 처음 들어올 때만 재생 */
.pfw.play .rise{animation:rise .75s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*90ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.pfw.play .donut-seg{animation:draw 1.1s cubic-bezier(.3,.7,.2,1) both;animation-delay:calc(350ms + var(--i)*110ms)}
@keyframes draw{from{stroke-dasharray:0 600}}
.pfw.play .mbar .stk{animation:grow .9s cubic-bezier(.2,.9,.25,1.12) both;animation-delay:calc(450ms + var(--i)*80ms)}
@keyframes grow{from{transform:scaleY(0)}}
.pfw.play .heat i{animation:pfpop .45s ease both;animation-delay:calc(450ms + var(--i)*16ms)}
@keyframes pfpop{from{opacity:0;transform:scale(.2)}}
.pfw.play .gbar{animation:sweep 1.1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(450ms + var(--i)*90ms)}
@keyframes sweep{from{transform:scaleX(0)}}
.pfw.play .radar .poly{animation:bloom 1.3s cubic-bezier(.2,1.3,.4,1) both .45s;transform-box:view-box;transform-origin:120px 120px}
@keyframes bloom{from{transform:scale(0) rotate(-40deg);opacity:0}}
/* 도넛·레이더·흐름 그래프 움직임 */
.donut{position:relative}.donut svg{position:relative}
.d-glow{position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle,rgba(57,135,229,.45),transparent 70%);filter:blur(16px);animation:breathe 4.5s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.15);opacity:.55}}
.d-orbit{transform-origin:100px 100px;animation:spin 48s linear infinite}
.d-orbit2{transform-origin:100px 100px;animation:spin 7s linear infinite reverse}
.sg{transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s}.sg:hover{transform:translate(var(--dx),var(--dy))}.sg.dim{opacity:.25}
.donut .dn{transition:fill .2s}.donut.hov .dl{fill:#fff}
.dlist>div{grid-template-columns:10px minmax(0,1fr) auto 38px;row-gap:4px;padding:3px 6px;margin:0 -6px;border-radius:6px;cursor:default}
.dlist>div:hover{background:rgba(255,255,255,.05)}
.dlist .bar{grid-column:2/-1;height:3px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden}
.dlist .bar i{display:block;height:100%;border-radius:2px;transform-origin:left}
.pfw.play .dlist .bar i{animation:sweep 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(700ms + var(--i)*90ms)}
.r-glow{stroke-opacity:.45;animation:rpulse 5s ease-in-out infinite}@keyframes rpulse{50%{stroke-opacity:.15}}
.r-halo{opacity:0;transform-box:fill-box;transform-origin:center}
.r-pt:hover .r-halo{animation:halo 1.4s ease-out infinite}
@keyframes halo{0%{transform:scale(1);opacity:.6}100%{transform:scale(3);opacity:0}}
.r-lab{transition:fill .2s}.r-lab.on{fill:#fff;font-weight:700}
.r-pt circle:last-child{transition:r .2s}.r-pt:hover circle:last-child{r:6.5}
.pfw.play .r-pt{animation:pfpop .45s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(1.2s + var(--i)*90ms);transform-box:fill-box;transform-origin:center}
.flow svg{width:100%;height:auto;display:block;overflow:visible}
.f-tot{font:600 12px var(--num);fill:rgba(235,235,245,.8)}.f-lb{font-size:12px;fill:rgba(235,235,245,.45)}
.f-guide{opacity:0;transition:opacity .15s}.f-col:hover .f-guide{opacity:1}
.f-dot{transition:r .15s,fill .15s}.f-col:hover .f-dot{r:7;fill:#a9d3ff}
.f-shine{mix-blend-mode:overlay;animation:shine 7s ease-in-out infinite 2.4s}@keyframes shine{0%{transform:translateX(0)}55%,100%{transform:translateX(1250px)}}
.pfw.play .f-reveal{animation:sweep 1.9s cubic-bezier(.45,.05,.2,1) both .3s;transform-box:fill-box;transform-origin:left}
.pfw.play .f-line{stroke-dasharray:1;animation:dash 2s cubic-bezier(.45,.05,.2,1) both .3s}@keyframes dash{from{stroke-dashoffset:1}}
.pfw.play .f-dot,.pfw.play .f-tot{animation:pfpop .45s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(.45s + var(--i)*200ms);transform-box:fill-box;transform-origin:center}
/* 일별 업무 밀도(월별) */
.hm{display:grid;gap:12px}
.hm-top{display:flex;align-items:center;gap:10px}
.hm-arr{width:32px;height:32px;border-radius:50%;font-size:20px;line-height:1;background:rgba(255,255,255,.06);border:.5px solid rgba(255,255,255,.12)}
.hm-arr:hover:not(:disabled){background:rgba(10,132,255,.25);border-color:rgba(10,132,255,.5)}.hm-arr:disabled{opacity:.25}
.hm-ttl{flex:1;display:grid;justify-items:center}.hm-ttl b{font-size:16px}.hm-ttl span{font-size:12px;color:var(--fg2)}
.hm-dots{display:flex;justify-content:center;gap:6px}.hm-dots button{width:7px;height:7px;padding:0;border:0;border-radius:4px;background:rgba(255,255,255,.2);transition:width .25s,background .25s}
.hm-dots button.on{width:22px;background:#5b9cf0}
.hm-body{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
.hm-body.in-r{animation:hmR .45s cubic-bezier(.2,.8,.2,1)}.hm-body.in-l{animation:hmL .45s cubic-bezier(.2,.8,.2,1)}
@keyframes hmR{from{opacity:0;transform:translateX(40px)}}@keyframes hmL{from{opacity:0;transform:translateX(-40px)}}
.hm-cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-width:460px;width:100%;justify-self:center}
.hm-w{font-size:10.5px;color:var(--fg3);text-align:center;padding-bottom:2px}
.hm-d{aspect-ratio:1;border:0;border-radius:8px;background:var(--bg);position:relative;display:grid;place-items:center;color:rgba(235,235,245,.75);font:500 11.5px var(--num);cursor:pointer;transition:transform .15s,box-shadow .15s}
.hm-d:disabled{cursor:default;color:var(--fg3)}.hm-d.we span{color:var(--fg3)}
.hm-d b{position:absolute;right:5px;bottom:3px;font:700 9.5px var(--num);color:#fff;opacity:.85}
.hm-d:not(:disabled):hover{transform:scale(1.08);box-shadow:0 0 0 1px rgba(255,255,255,.5)}
.hm-d.on{box-shadow:0 0 0 2px #fff,0 0 18px rgba(91,156,240,.7)}.hm-d.td{outline:1px dashed rgba(255,255,255,.5);outline-offset:1px}
.pfw.play .hm-d{animation:pfpop .4s ease both;animation-delay:calc(400ms + var(--i)*18ms)}
.hm-thread{display:grid;gap:8px;align-content:start;max-height:330px;overflow:auto}
.hm-th{display:flex;align-items:baseline;gap:8px}.hm-th b{font-size:14px}.hm-th span{font-size:12px;color:var(--fg2)}
.hm-thread ol{list-style:none;margin:0;padding:0 0 0 14px;border-left:1.5px solid rgba(255,255,255,.12);display:grid;gap:10px}
.hm-thread li{position:relative;animation:rise .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*60ms)}
.hm-thread li::before{content:"";position:absolute;left:-19.5px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--card),0 0 10px var(--c)}
.hm-thread li p{margin:0;font-size:13px;line-height:1.45}
.hm-thread .meta{display:flex;gap:8px;font-size:11px;color:var(--fg3);margin-top:2px}.hm-thread .hi{color:#ff6961}
@media (max-width:760px){.hm-body{grid-template-columns:1fr}}
/* 스토리 모드 */
.story{position:fixed;inset:0;z-index:60;background:#06060a;display:grid;grid-template-rows:minmax(0,1fr) auto;color:var(--fg);overflow:hidden;isolation:isolate}
.story .au{inset:-20%;opacity:.38}
.s-x{position:absolute;top:16px;right:18px;z-index:2}
.s-stage{display:grid;place-items:center;padding:7vh 7vw 2vh;overflow:auto;cursor:pointer}
.s-slide{width:100%;max-width:1040px;display:grid;gap:18px;text-align:left;animation:sIn .6s cubic-bezier(.2,.8,.2,1) both;cursor:auto;transition:opacity .22s ease,transform .22s ease}
.s-slide.out{opacity:0;transform:translateY(-10px)}
@keyframes sIn{from{opacity:0;transform:translateY(16px)}}
.story{animation:fadeIn .35s ease both}.story.bye{opacity:0;transition:opacity .25s}
@keyframes fadeIn{from{opacity:0}}
.s-h{margin:0;font-size:clamp(28px,4vw,52px);font-weight:760;letter-spacing:-.025em;display:flex;align-items:center;gap:14px}
.s-dot{width:14px;height:14px;border-radius:50%;flex:none}
.s-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:40px;align-items:center}
.s-list{display:grid;gap:14px}
.s-list>div{display:grid;grid-template-columns:14px auto 1fr;gap:12px;align-items:center;font-size:clamp(15px,1.6vw,20px)}
.s-list i{width:14px;height:14px;border-radius:4px}.s-list span{color:var(--fg2);text-align:right;font-family:var(--num)}
.s-wide .grow{grid-template-columns:200px minmax(0,1fr) 64px;font-size:14px}.s-wide .gtrack{height:26px}
.s-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.s-cards.one{grid-template-columns:1fr}
.s-cards>div{background:rgba(255,255,255,.05);border:.5px solid rgba(255,255,255,.12);border-radius:14px;padding:14px 16px;display:grid;gap:4px;backdrop-filter:blur(10px)}
.s-cards small{color:var(--fg3);font:500 12px var(--num)}.s-cards b{font-weight:600;font-size:15px;line-height:1.5}
.s-nav{display:flex;justify-content:center;align-items:center;gap:14px;padding:14px 16px 22px}
.s-dots{display:flex;gap:6px}.s-dots button{width:7px;height:7px;padding:0;border:0;border-radius:4px;background:rgba(255,255,255,.25);transition:width .3s,background .3s}
.s-dots button.on{width:26px;background:#fff}
@media (max-width:760px){.pf-big{grid-template-columns:repeat(2,minmax(0,1fr))}.pf-title{font-size:26px}.donut-wrap,.s-row{grid-template-columns:1fr;justify-items:center}.grow{grid-template-columns:96px minmax(0,1fr) 48px}.s-cards{grid-template-columns:1fr}}

/* 포트폴리오 */
.pf{background:rgba(0,0,0,.18);border:.5px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px;text-align:left;cursor:pointer}
.pf:hover{background:rgba(255,255,255,.06)}
.pf b{font-size:13px;font-weight:600}
.pf p{margin:0;font-size:12.5px;color:var(--fg2);white-space:pre-wrap}
.pf .meta{font-size:11px;color:var(--fg3)}

/* 도구 */
.timer{display:grid;justify-items:center;gap:12px}
.timer .dial{position:relative;width:210px;height:210px}
.timer .dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .dial .t{position:absolute;inset:0;display:grid;place-items:center;font:200 46px var(--num);font-variant-numeric:tabular-nums}
.calc-out{display:grid;gap:4px;background:rgba(0,0,0,.2);border-radius:10px;padding:10px 12px;font-size:13px}
.calc-out div{display:flex;justify-content:space-between;gap:10px}
.calc-out b{font-family:var(--num);font-variant-numeric:tabular-nums}
.calc-out .tot{border-top:.5px solid var(--line);padding-top:6px;margin-top:2px;font-size:14px}
.calc-out .tot b{color:var(--green)}
.scan .f em.saved{font-style:normal;font-size:10px;color:#7ee2a0;margin-left:4px}

/* 검사 창(오른쪽 시트) */
.sheet{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));width:min(400px,calc(100vw - 20px));z-index:30;
  background:rgba(44,44,46,.86);backdrop-filter:blur(40px) saturate(1.6);-webkit-backdrop-filter:blur(40px) saturate(1.6);border:.5px solid rgba(255,255,255,.16);
  border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;animation:slide .2s ease}
@keyframes slide{from{transform:translateX(16px);opacity:0}}
.sheet header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:.5px solid var(--line)}
.sheet header b{flex:1;font-size:13px;color:var(--fg2);font-weight:500}
.sheet .bd{overflow:auto;padding:14px;display:grid;gap:14px;align-content:start}
.sheet textarea.title{font-size:18px;font-weight:650;background:transparent;border:0;resize:none;width:100%;padding:0;line-height:1.35}
.sheet textarea.title:focus{outline:0}
.field{display:grid;gap:6px}
.field>label{font-size:11.5px;color:var(--fg3);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:var(--fill);border-radius:20px;padding:4px 11px;font-size:12.5px}
.chip:hover{background:var(--fill-2)}
.chip[aria-pressed="true"]{background:var(--blue);color:#fff}
.note{font-size:13px;white-space:pre-wrap;background:rgba(0,0,0,.2);border-radius:8px;padding:8px 10px;color:var(--fg2)}
.sheet footer{padding:12px 14px;border-top:.5px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}

.doc{display:grid;gap:4px;font-size:13.5px;line-height:1.6}
.doc h3{margin:6px 0 2px;font-size:16px;font-weight:700}
.doc section{background:rgba(0,0,0,.2);border-radius:10px;padding:10px 12px 8px;display:grid;gap:2px;margin-top:6px}
.doc h4{margin:0 0 4px;font-size:12px;font-weight:700;color:#6cb4ff;letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.doc h4::before{content:"";width:3px;height:12px;border-radius:2px;background:#0a84ff}
.doc h5{margin:6px 0 0;font-size:12.5px;font-weight:650;color:var(--fg)}
.doc p{margin:0;color:var(--fg)}
.doc .li{display:grid;grid-template-columns:14px 1fr;gap:4px;color:var(--fg)}
.doc .li>i{font-style:normal;color:var(--fg3);text-align:center}
.doc .li.done{color:var(--fg3);text-decoration:line-through}
.doc blockquote{margin:2px 0;padding:2px 10px;border-left:2px solid var(--fg3);color:var(--fg2)}
.doc hr{border:0;border-top:.5px solid var(--line);margin:8px 0}
.sheet .grip{position:absolute;left:-5px;top:0;bottom:0;width:10px;cursor:ew-resize;z-index:2;touch-action:none}
.sheet .grip::after{content:"";position:absolute;left:3px;top:50%;width:4px;height:44px;margin-top:-22px;border-radius:2px;background:rgba(255,255,255,.18);opacity:0;transition:opacity .15s}
.sheet:hover .grip::after,.sheet .grip.on::after{opacity:1}

/* 명령 팔레트 */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:grid;justify-items:center;align-items:start;padding:12vh 16px 16px}
.palette{width:min(620px,100%);background:rgba(44,44,46,.9);backdrop-filter:blur(40px) saturate(1.6);-webkit-backdrop-filter:blur(40px) saturate(1.6);
  border:.5px solid rgba(255,255,255,.16);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden}
.palette input{width:100%;border:0;background:transparent;padding:16px 18px;font-size:18px;border-bottom:.5px solid var(--line)}
.palette input:focus{outline:0}
.palette ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.palette li{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;font-size:13.5px;cursor:pointer}
.palette li[aria-selected="true"]{background:var(--blue)}
.palette li small{margin-left:auto;color:var(--fg3);font-size:11.5px}
.palette li[aria-selected="true"] small{color:rgba(255,255,255,.75)}

/* 음악 — 턴테이블 */
.music{display:grid;grid-template-columns:minmax(0,1fr);min-width:0;gap:8px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.25));border:.5px solid var(--line);border-radius:12px;padding:10px 10px 8px}
.deck{position:relative;height:150px;display:grid;place-items:center}
.vinyl{position:relative;width:140px;height:140px;border-radius:50%;
  background:radial-gradient(circle,#0c0c0d 0 31%,transparent 31.5%),repeating-radial-gradient(circle,#141415 0 1.6px,#1d1d1f 1.6px 3px);
  box-shadow:0 10px 26px rgba(0,0,0,.65),inset 0 0 0 1px rgba(255,255,255,.06);animation:spin 3.4s linear infinite;animation-play-state:paused}
.vinyl.spin{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.sheen{position:absolute;width:140px;height:140px;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 20deg,transparent 0 10%,rgba(255,255,255,.09) 14%,transparent 20% 58%,rgba(255,255,255,.07) 63%,transparent 69%)}
.label{position:absolute;inset:0;margin:auto;width:58px;height:58px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 50%,transparent 0 9px,rgba(0,0,0,.08) 9.5px 10px,transparent 10.5px 21px,rgba(140,110,70,.25) 21.5px 22px,transparent 22.5px),radial-gradient(circle at 35% 30%,#f6f1e6,#ddd3c0 75%) center/cover no-repeat;box-shadow:0 0 0 2px #0c0c0d}
.label .yt{position:absolute;left:50%;top:50%;width:104px;height:58px;transform:translate(-50%,-50%)}
.label .yt iframe,.label .yt>div{width:100%;height:100%;display:block;border:0;pointer-events:none}
.label::after{content:"";position:absolute;inset:0;margin:auto;width:7px;height:7px;border-radius:50%;background:#1c1c1e;box-shadow:0 0 0 1.5px rgba(255,255,255,.35)}
.arm{position:absolute;right:4px;top:0;width:56px;height:112px;transform-origin:42px 12px;transform:rotate(-26deg);transition:transform .7s cubic-bezier(.3,1.4,.5,1);pointer-events:none}
.arm.on{transform:rotate(2deg)}
.music .now{display:grid;gap:1px;min-width:0;text-align:center}
.music .now b{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.music .now span{font-size:11px;color:var(--fg3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.music .ctl{display:flex;align-items:center;justify-content:center;gap:2px}
.music .ctl .play{width:34px;height:34px;border-radius:50%;background:var(--fg);color:#1c1c1e}
.music .ctl .play:hover{background:#fff;color:#000}
.music .vol{display:flex;align-items:center;gap:6px;color:var(--fg3)}
.music input[type=range]{flex:1;accent-color:var(--fg2);min-width:0}
.mlist{display:grid;gap:2px}
.mrow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px;border-radius:8px;border:0;background:transparent;text-align:left;width:100%}
.mrow:hover{background:rgba(255,255,255,.07)}
.mrow[aria-current="true"]{background:rgba(10,132,255,.18)}
.mrow img,.mrow .ph{width:48px;height:36px;border-radius:5px;object-fit:cover;background:var(--fill)}
.mrow b{font-size:13px;font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow span{font-size:11.5px;color:var(--fg3)}

/* 신호등 */
.lights button{width:12px;height:12px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;font:700 9px/1 var(--font);color:transparent;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.25)}
.lights button:nth-child(1){background:#ff5f57}.lights button:nth-child(2){background:#febc2e}.lights button:nth-child(3){background:#28c840}
.lights:hover button,.lights button:focus-visible{color:rgba(0,0,0,.6)}
.app.focus{grid-template-columns:minmax(0,1fr)}
.app.focus .side{display:none}
.toolbar .lights{padding:0 6px 0 0}

/* 날씨 */
.wx{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:12px;background:var(--card);border:.5px solid var(--line)}
.wx .ic{font-size:30px;line-height:1}
.wx b{font:600 24px/1 var(--num)}
.wx .d{display:grid;font-size:11.5px;color:var(--fg2)}
.wx button{border:0;background:transparent;color:var(--fg3);font-size:11px;padding:0;text-align:left}
.wx button:hover{color:var(--blue)}
.day .wxs{margin-left:auto;font-size:11px;color:var(--fg2);white-space:nowrap}

/* 메일 */
.mail{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:8px;align-items:start;padding:8px 4px;border-bottom:.5px solid var(--line);border-radius:6px}
.mail:last-child{border-bottom:0}
.mail:hover{background:rgba(255,255,255,.035)}
.mail .dot{width:8px;height:8px;border-radius:50%;margin-top:6px}
.mail.un .dot{background:var(--blue)}
.mail .bd{min-width:0;cursor:pointer;display:grid;gap:1px}
.mail .top{display:flex;gap:8px;align-items:baseline}
.mail .top b{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.mail.un .top b{font-weight:700}
.mail .top small{font-size:11px;color:var(--fg3);white-space:nowrap}
.mail .sj{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mail .sn{font-size:11.5px;color:var(--fg3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mail .acts{display:flex;gap:0;opacity:0;transition:opacity .15s}
.mail:hover .acts,.mail:focus-within .acts{opacity:1}
.msg{background:rgba(0,0,0,.2);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.msg .h{font-size:12px;color:var(--fg2)}
.msg pre{margin:0;white-space:pre-wrap;font:13px/1.55 var(--font);overflow-wrap:anywhere}

/* 브리핑 */
.news-days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.nday{flex:none;border:.5px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;text-align:left;display:grid;gap:1px}
.nday b{font-size:13px}.nday span{font-size:11px;color:var(--fg3)}
.nday[aria-pressed="true"]{background:var(--blue);border-color:var(--blue)}.nday[aria-pressed="true"] span{color:rgba(255,255,255,.8)}
.art{display:grid;gap:4px;padding:10px 4px;border-bottom:.5px solid var(--line)}
.art:last-child{border-bottom:0}
.art a{color:var(--fg);text-decoration:none;font-size:14px;font-weight:500}
.art a:hover{color:#409cff}
.art .meta{display:flex;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--fg3);align-items:center}

/* 월간 */
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.month .wd{font-size:11px;color:var(--fg3);text-align:center;padding:2px 0}
.mcell{background:rgba(0,0,0,.18);border:.5px solid var(--line);border-radius:8px;padding:5px;min-height:108px;display:grid;gap:2px;align-content:start;min-width:0;cursor:pointer}
.mcell:hover{border-color:rgba(255,255,255,.2)}
.mcell.out{opacity:.4}
.mcell.today{border-color:rgba(10,132,255,.7)}
.mcell.over{background:rgba(10,132,255,.16)}
.mcell .hd{display:flex;align-items:center;gap:4px;font:600 12px var(--num)}
.mcell.today .hd b{background:var(--red);color:#fff;border-radius:50%;width:20px;height:20px;display:grid;place-items:center}
.mcell.sun .hd b{color:#ff6961}.mcell.today.sun .hd b{color:#fff}
.mcell .hd span{margin-left:auto;font-size:11px}
.mi{font-size:11px;padding:1px 4px;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi.ev{background:rgba(10,132,255,.2);color:#cfe5ff}
.mi.t{color:var(--fg2)}.mi.t.hi{color:#ffb340}.mi.t.done{color:var(--fg3);text-decoration:line-through}
.mi.more{color:var(--fg3)}
.mcell .cnt{display:none;font-size:10px;color:var(--fg3)}

/* 계산기 */
.calc{display:grid;gap:8px}
.calc .disp{background:rgba(0,0,0,.3);border-radius:10px;padding:10px 14px;text-align:right;display:grid}
.calc .disp small{font-size:12px;color:var(--fg3);min-height:16px}
.calc .disp b{font:300 34px/1.15 var(--num);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keys button{height:46px;border-radius:23px;border:0;background:#333336;font:500 18px var(--num)}
.keys button:hover{filter:brightness(1.25)}
.keys button.fn{background:#5a5a5e}
.keys button.op{background:rgba(10,132,255,.2);color:#6cb4ff;box-shadow:inset 0 0 0 .5px rgba(100,170,255,.28)}
.keys button.op.on{background:#f5f5f7;color:#0a84ff}
.keys button.op.eq{background:linear-gradient(180deg,#2b93ff,#0a6fe0);color:#fff;box-shadow:0 4px 14px rgba(10,132,255,.35)}
.keys button.zero{grid-column:span 2}
.tm-edit{font:200 40px var(--num);width:150px;text-align:center;background:rgba(0,0,0,.3);border:.5px solid var(--line);border-radius:10px;color:var(--fg)}

/* 알림 */
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;background:rgba(58,58,60,.95);border:.5px solid rgba(255,255,255,.16);
  border-radius:20px;padding:8px 16px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;gap:10px;align-items:center;max-width:calc(100vw - 32px)}
.toast.bad{background:rgba(120,30,28,.95)}
.toast button{border:0;background:transparent;color:#409cff;font-weight:600}

/* 연결 화면 */
.setup{position:fixed;inset:0;display:grid;place-items:center;padding:16px;z-index:60}
.setup .box{width:min(440px,100%);background:rgba(44,44,46,.82);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border:.5px solid rgba(255,255,255,.16);border-radius:16px;padding:26px;display:grid;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.setup h2{margin:0;font-size:20px}
.setup p{margin:0;color:var(--fg2);font-size:13px}
.setup .err{color:#ff6961;font-size:12.5px}
.banner{background:rgba(255,159,10,.14);border:.5px solid rgba(255,159,10,.35);color:#ffc266;border-radius:10px;padding:8px 12px;font-size:12.5px;display:flex;gap:10px;align-items:center}

/* 빠른 입력 창·원인 확인 */
.qmodal{width:min(680px,100%);display:grid;gap:6px}
.qmodal .quick{background:rgba(44,44,46,.95);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border:.5px solid rgba(255,255,255,.16);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.diag{width:min(560px,100%);background:rgba(44,44,46,.95);border:.5px solid rgba(255,255,255,.16);border-radius:14px;padding:18px;display:grid;gap:12px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.diag h3{margin:0;font-size:16px}
.diag .r{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:10px;font-size:13px;align-items:start}
.diag ol{margin:0;padding-left:18px;font-size:12.5px;color:var(--fg2);display:grid;gap:4px}
.banner.bad-b{background:rgba(255,69,58,.12);border-color:rgba(255,69,58,.35);color:#ff8a80;flex-wrap:wrap}
/* 스캔함 */
.scan{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start;padding:8px 2px;border-bottom:.5px solid var(--line)}
.scan:last-child{border-bottom:0}
.scan.done{opacity:.5}
.scan .files{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.scan .f{display:inline-flex;align-items:center;gap:4px;border:0;border-radius:6px;background:var(--fill);padding:3px 8px;font-size:11.5px;max-width:100%}
.scan .f:hover{background:var(--fill-2)}
.scan .f span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
/* 주식 */
.stk{display:grid;grid-template-columns:minmax(0,1fr) 110px 96px;gap:10px;align-items:center;padding:8px 2px;border-bottom:.5px solid var(--line)}
.stk:last-child{border-bottom:0}
.stk b{font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stk small{font-size:11px;color:var(--fg3)}
.stk .px{text-align:right;display:grid;justify-items:end;gap:2px}
.stk .px b{font:600 14px var(--num);font-variant-numeric:tabular-nums}
.chg{font:600 11.5px var(--num);padding:2px 7px;border-radius:6px;color:#fff;min-width:64px;text-align:right}
.chg.up{background:#e5484d}.chg.dn{background:#2f6fe4}.chg.eq{background:var(--fill)}
.stk .x{opacity:0}.stk:hover .x{opacity:1}

/* 모바일 */
.tabbar{display:none}
@media (max-width:1180px){.g-today{grid-template-columns:minmax(0,1fr)} .g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1000px){.week{grid-template-columns:repeat(7,minmax(150px,1fr));overflow-x:auto;padding-bottom:4px}}
@media (max-width:760px){
  body{overflow:auto}
  .app{inset:0;border-radius:0;border:0;grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;right:0;bottom:0;z-index:20;border-right:0;border-top:.5px solid rgba(255,255,255,.12);background:rgba(30,30,32,.8)}
  .side .lights,.side .nav,.side .sync{display:none}
  .side-foot{border:0;padding:0}
  .music{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:calc(64px + env(safe-area-inset-bottom));width:220px;z-index:21;background:rgba(44,44,46,.92);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
  .music.mclosed{display:none}
  .tabbar{display:flex;overflow-x:auto;padding:6px max(8px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-right));gap:2px}
  .tabbar button{flex:1;min-width:58px;border:0;background:transparent;display:grid;justify-items:center;gap:2px;font-size:10.5px;color:var(--fg2);padding:4px 2px;border-radius:8px}
  .tabbar button svg.i{width:20px;height:20px}
  .tabbar button[aria-current="page"]{color:var(--blue)}
  .toolbar{padding:10px max(16px,env(safe-area-inset-left)) 10px max(16px,env(safe-area-inset-right))}
  .toolbar .search{min-width:0}.toolbar .search span,.toolbar .search kbd{display:none}
  .scroll{padding:16px max(16px,env(safe-area-inset-right)) 120px max(16px,env(safe-area-inset-left))}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .hero h2,.hero .clock{font-size:24px}
  .hero .sum{margin-left:0}
  .stat{min-width:72px;padding:6px 10px}
  .hgrid{grid-template-columns:minmax(90px,1.4fr) repeat(7,minmax(22px,1fr)) 46px}
  .task .act,.mail .acts{opacity:1}
  .mcell{min-height:58px;padding:3px}.mcell .mi{display:none}.mcell .cnt{display:block}
  .wx .d{display:none}
  .stk{grid-template-columns:minmax(0,1fr) 70px 86px}
  .diag .r{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

<body>
<div class="app" id="app">
  <aside class="side" aria-label="메뉴">
    <div class="lights" id="lights"></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="music" id="music"></div>
      <div class="sync" id="sync"></div>
    </div>
    <div class="tabbar" id="tabbar"></div>
  </aside>
  <main class="main">
    <div class="toolbar" id="toolbar"></div>
    <div class="scroll" id="scroll"><div class="page" id="page"></div></div>
  </main>
</div>
<div id="layer"></div>

<script src="config.js"></script>
<script>
"use strict";

const $=s=>document.querySelector(s);

  const el=document.createElement(tag);

    if(k.startsWith("on")&&typeof v==="function")el.addEventListener(k.slice(2),v);
    else if(k==="class")el.className=v;else if(k==="style")el.style.cssText=v;else if(k==="html")el.innerHTML=v;

}

const ICON={

  att:'<circle cx="8" cy="8" r="6.2"/><path d="M8 4.5V8l2.4 1.6"/>',
  star:'<path d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z"/>',
  tools:'<circle cx="8" cy="9" r="5.2"/><path d="M8 9V6.2M6.5 1.8h3M12.4 4.4l1-1"/>',
  plus:'<path d="M8 3v10M3 8h10"/>',search:'<circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/>',

  music:'<path d="M6 12.5V3.5l7-1.5v9"/><circle cx="4.3" cy="12.5" r="1.8"/><circle cx="11.3" cy="11" r="1.8"/>',
  left:'<path d="M10 3L5 8l5 5"/>',right:'<path d="M6 3l5 5-5 5"/>',x:'<path d="M4 4l8 8M12 4l-8 8"/>',
  trash:'<path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 9h5.8l.6-9"/>',ext:'<path d="M9 2.5h4.5V7M13.5 2.5L7.5 8.5M12 9.5v4H2.5V4h4"/>',

function parseQuick(raw){
  let t=" "+raw+" ",d=null,time=null,r=null,p=null;const today=TODAY();
  t=t.replace(/\s!(상|중|하)(?=\s)/,(m,a)=>{r=a;return" "});
  t=t.replace(/\s!!!(?=\s)/,()=>{r="상";return" "}).replace(/\s!!(?=\s)/,()=>{r=r||"중";return" "});
  t=t.replace(/\s#(\S+)/,(m,a)=>{const hit=PROJECTS.find(x=>x.replace(/\s/g,"").includes(a))||PROJECTS.find(x=>a.includes(x.replace(/\s/g,"").slice(0,3)));if(hit){p=hit;return" "}return m});
  const W={"월":1,"화":2,"수":3,"목":4,"금":5,"토":6,"일":0};
  const rules=[
    [/\s(오늘)(?=\s)/,()=>today],[/\s(내일)(?=\s)/,()=>addD(today,1)],[/\s(모레)(?=\s)/,()=>addD(today,2)],[/\s(글피)(?=\s)/,()=>addD(today,3)],
    [/\s(다음\s?주|담주)\s?([월화수목금토일])요일?(?=\s)/,m=>addD(monOf(today),7+((W[m[2]]+6)%7))],
    [/\s(이번\s?주)\s?([월화수목금토일])요일?(?=\s)/,m=>addD(monOf(today),(W[m[2]]+6)%7)],
    [/\s(다음\s?주|담주)(?=\s)/,()=>addD(monOf(today),7)],
    [/\s([월화수목금토일])요일(?=\s)/,m=>{for(let i=0;i<7;i++){const x=addD(today,i);if(pD(x).getDay()===W[m[1]])return x}return today}],
    [/\s(\d{1,2})월\s?(\d{1,2})일(?=\s)/,m=>md(+m[1],+m[2])],[/\s(\d{1,2})[\/.](\d{1,2})(?=\s)/,m=>md(+m[1],+m[2])],
    [/\s(\d+)일\s?(뒤|후)(?=\s)/,m=>addD(today,+m[1])],
  ];
  function md(M,D){const y=new Date().getFullYear();let s=`${y}-${pad(M)}-${pad(D)}`;if(diff(s,today)<-60)s=`${y+1}-${pad(M)}-${pad(D)}`;return s}
  for(const [re,fn] of rules){const m=t.match(re);if(m){d=fn(m);t=t.replace(m[0]," ");break}}
  const tm=t.match(/\s(오전|오후)?\s?(\d{1,2})시\s?(반|(\d{1,2})분)?(?=\s)/)||t.match(/\s(오전|오후)?\s?(\d{1,2}):(\d{2})(?=\s)/);
  if(tm){let H=+tm[2],Mi=tm[3]==="반"?30:+(tm[4]||tm[3]||0);if(isNaN(Mi))Mi=0;if(tm[1]==="오후"&&H<12)H+=12;if(!tm[1]&&H>=1&&H<=7)H+=12;
    if(H<24&&Mi<60){time=`${pad(H)}:${pad(Mi)}`;t=t.replace(tm[0]," ")}}
  if(time&&!d)d=today;
  const title=t.replace(/\s+/g," ").trim();
  return {t:title,d:d?(time?`${d}T${time}:00+09:00`:d):null,r,p,time,day:d};
}
